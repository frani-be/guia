<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guía Freelancer · frani.be</title>
<meta name="robots" content="noindex, nofollow">
<style>
  * { margin: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    font-family: ui-rounded, "DM Sans", system-ui, -apple-system, sans-serif;
    color: #241d2e;
    background:
      radial-gradient(700px 340px at 15% 0%, #eedffc 0%, transparent 60%),
      radial-gradient(800px 420px at 90% 100%, #eedffc 0%, transparent 55%),
      #f7f5fa;
  }
  .card {
    max-width: 480px;
    width: 100%;
    background: #fff;
    border: 1px solid #ece4f5;
    border-radius: 20px;
    padding: 40px 36px;
    text-align: center;
    box-shadow: 0 12px 40px rgba(109, 26, 150, .08);
  }
  .spark { color: #b55aff; display: inline-block; margin-bottom: 18px; }
  h1 { font-size: 24px; margin-bottom: 12px; letter-spacing: -0.01em; }
  p { color: #5c5766; line-height: 1.6; font-size: 15px; }
  p + p { margin-top: 10px; }
  a { color: #8b2db3; font-weight: 600; text-decoration: none; border-bottom: 1px dashed #d4b0f7; }
  a:hover { border-bottom-style: solid; }
  .tag {
    display: inline-block;
    margin-bottom: 16px;
    padding: 5px 12px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: #6d1a96;
    background: #eedffc;
    border-radius: 999px;
  }
</style>
</head>
<body>
  <main class="card">
    <svg class="spark" width="40" height="40" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M12 2l1.9 5.9L20 9.8l-6.1 1.9L12 18l-1.9-6.3L4 9.8l6.1-1.9L12 2z" fill="currentColor"/>
      <path d="M19 15l.9 2.6 2.6.9-2.6.9L19 22l-.9-2.6-2.6-.9 2.6-.9L19 15z" fill="currentColor" opacity=".7"/>
    </svg>
    <span class="tag">Contenido privado</span>
    <h1>Guía Freelancer</h1>
    <p>Esta guía se comparte con un link personal. Si te la envié, usa el link completo que recibiste por DM junto con tu clave.</p>
    <p>¿No te llegó? Escríbeme por <a href="https://www.instagram.com/frani.be">Instagram</a>.</p>
  </main>
</body>
</html>
